; Default graphics quality for the packaged game: Medium (0 = Low, 1 = Medium, 2 = High, 3 = Epic).
; Version must match UE_GAMEUSERSETTINGS_VERSION (5 in UE 5.7); without it the engine treats the
; settings as outdated on first launch and resets every quality group to Epic.
[/Script/Engine.GameUserSettings]
Version=5

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=1
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.TextureQuality=1
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1
sg.LandscapeQuality=1
